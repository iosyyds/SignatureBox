name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project SignatureBox.xcodeproj \
            -scheme SignatureBox \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CONFIGURATION_BUILD_DIR=./build 2>&1 | tee build.log
        continue-on-error: true

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Check build output
        run: find build -name "*.app" -type d || echo "no app found"

      - name: Package IPA
        run: |
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found, exiting"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r SignatureBox.ipa Payload
          mv SignatureBox.ipa ../

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: SignatureBox.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
