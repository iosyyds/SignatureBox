name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          ls /Applications/ | grep Xcode

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Show project
        run: ls -la

      - name: Build for testing (unsigned)
        run: |
          xcodebuild build \
            -project SignatureBox.xcodeproj \
            -scheme SignatureBox \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CONFIGURATION_BUILD_DIR=./build

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/SignatureBox.app build/Payload/
          cd build
          zip -r SignatureBox-unsigned.ipa Payload
          mv SignatureBox-unsigned.ipa ../

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: SignatureBox-unsigned.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
